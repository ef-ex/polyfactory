; polyfactory - tooling config only.  There is no package build here; this
; file exists because `mutmut` reads its settings from it.
;
; v2 principle 3 (Google's policy, verified and adopted): mutation analysis
; runs on CHANGED, COVERED lines per change, and wholesale only at milestones.
; `paths_to_mutate` below is the WHOLE pure-Python kernel - that is the
; milestone form.  The per-cycle form narrows it to the files git says moved;
; the one command is documented in tests/README.md.
;
; !! THE KERNEL IS THE hou-FREE SET, and it is listed rather than globbed on
; purpose.  `place.py`, `conform.py`, `hda.py`, `kit.py`, `style.py` and
; `facade.py` all import `hou`, so mutmut's runner (plain pytest, no Houdini)
; could not even import them - a mutant there would be reported as killed by
; an ImportError, which is a green earned by nothing.  Those layers are the
; hand-written registry's job (`tests/polychain/mutations.py`), for exactly
; the reason the skill gives: no tool can mutate an HDA, VEX or a scene.
;
; !! AND MUTMUT 3.x REFUSES TO RUN ON NATIVE WINDOWS - it exits with "please
; use the WSL" and nothing else (measured, 3.7.0, 2026-08-25).  2.5.0 runs.
; Pin it: `pip install "mutmut==2.5.0"`.

[mutmut]
paths_to_mutate =
    polyfactory/scripts/python/polyfactory/polychain/plan.py,
    polyfactory/scripts/python/polyfactory/polychain/decompose.py,
    polyfactory/scripts/python/polyfactory/polychain/corner.py,
    polyfactory/scripts/python/polyfactory/polychain/array2d.py,
    polyfactory/scripts/python/polyfactory/polychain/__init__.py
tests_dir = tests/unit/
runner = python -E -m pytest -x -q -p no:cacheprovider tests/unit/test_polychain.py tests/unit/test_polychain_plan.py tests/unit/test_polychain_corner.py tests/unit/test_polychain_array2d.py tests/unit/test_polychain_properties.py
backup = False
